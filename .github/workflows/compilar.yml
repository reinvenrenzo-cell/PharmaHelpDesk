
name: Compilar PharmaHelpDesk

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  compilar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo del repositorio
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compilar proyecto Maven
        run: mvn -B clean package

      - name: Guardar archivo WAR
        uses: actions/upload-artifact@v4
        with:
          name: PharmaHelpDesk-WAR
          path: target/*.war
          if-no-files-found: error
